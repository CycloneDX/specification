name: CT Non-Core Schemas Lint

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

env:
  NODE_VERSION: '24.x'

jobs:
  lint-externals:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema: # path relative to `schema` dir, without suffix `.schema.json`
          - 'behavior-taxonomy'
          - 'cryptography-defs'
          - 'jsf-0.82'
          - 'spdx'
    name: lint ${{ matrix.schema }}
    env:
      SCHEMA_FILE: schema/${{ matrix.schema }}.schema.json
      CONFIG_FILE: .config/${{ matrix.schema }}.cdxlintrc.json
      REPORT_FILE: tools/src/main/js/linter/reports/${{ matrix.schema }}.json
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install linter
        working-directory: tools/src/main/js/linter
        run: npm install
      - name: Lint schemas
        run: |
          set -eu
          mkdir -p "$(dirname "$REPORT_FILE")"
          # only run checks not carried over from source files
          node tools/src/main/js/linter/cli.js \
            --format json \
            --config "$CONFIG_FILE" \
            "$SCHEMA_FILE" \
            > "$REPORT_FILE"
      - name: Make report relative
        if: ${{ !cancelled() }}
        run: sed -i "s|${GITHUB_WORKSPACE}/||g" "$REPORT_FILE"
      - name: Print report
        if: '!cancelled()'
        run: cat "$REPORT_FILE"
      - name: Artifact report
        if: ${{ !cancelled() }}
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report_${{ matrix.schema_version }}-bundled
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 1
