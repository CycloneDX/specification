# docs: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CT CDX-2.x PHP

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

defaults:
  run:
    working-directory: tools/src/test/php/schema-v2

env:
  PHP_VERSION: "8.5"

jobs:
  discover-schema:
    uses: ./.github/workflows/discover_2.x_schemas.yml
  test_php:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema_version: ${{ fromJSON(needs.discover-schema.outputs.versions) }}
    name: test ${{ matrix.schema_version }}
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        # see https://github.com/shivammathur/setup-php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
      - name: Install Dependencies
        run: composer install
      - name: Run test
        env:
          SCHEMA_VERSION: ${{ matrix.schema_version }}
        run: composer run "test:v$SCHEMA_VERSION"
