name: Bundle CDX-2.0

on:
  push:
    branches:
      - 'master'
      - 'main'
      - '2.0-dev'
    paths:
      - '.github/workflows/bundle_2.0_schemas.yml' # self
      - 'tools/src/main/js/bundler/**'
      - 'schema/2.0/cyclonedx-2.0.schema.json'
      - 'schema/2.0/**/*.schema.json'
  workflow_dispatch:  # Allows manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: { }

env:
  SCHEMA_VERSION: 2.0
  MODULES_DIR: schema/2.0/modules
  SOURCE_FILE: schema/2.0/cyclonedx-2.0.schema.json
  BUNDLED_FILE: schema/2.0/cyclonedx-2.0-bundled.schema.json
  MINIFIED_FILE: schema/2.0/cyclonedx-2.0-bundled.min.schema.json
  NODE_VERSION: '24.x'
jobs:
  bundle-schemas:
    name: Bundle Schemas
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        working-directory: tools/src/main/js/bundler
        run: npm ci --no-fund --no-audit
      - name: Bundle schemas
        run: >
          node tools/src/main/js/bundler/bundle-schemas.js
          "$MODULES_DIR" "$SOURCE_FILE"
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload modified
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        # see https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modified
          path: |
            ${{ env.BUNDLED_FILE }}
            ${{ env.MINIFIED_FILE }}
          retention-days: 1
  test-schemas:
    name: Test Bundled Schemas
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download modified
        # see https://github.com/actions/download-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: modified
      - name: Setup Node.js
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Dependencies
        run: npm install --no-fund --no-audit
      - name: Run test
        env:
          CTX_TEST_BUNDLED: true
        run: npm run "test:v$SCHEMA_VERSION"
  push-schemas:
    name: Push Bundled Schemas
    needs:
      - bundle-schemas
      - test-schemas
    if: ${{ needs.bundle-schemas.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Required to push changes
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download modified
        # see https://github.com/actions/download-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: modified
      - name: Check for changes and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Add both files (works for both new and modified files)
          git add "$BUNDLED_FILE" "$MINIFIED_FILE"
          echo "Committing bundled schema changes"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update bundled schemas [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
