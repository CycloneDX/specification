# docs: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CT CDX-2.x JavaScript

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

defaults:
  run:
    working-directory: tools/src/test/js/schema-v2

env:
  NODE_VERSION: '24.x'

jobs:
  discover-schema:
    uses: ./.github/workflows/discover_2.x_schemas.yml
  test_js:
    needs:
      - discover-schema
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schema_version: ${{ fromJSON(needs.discover-schema.outputs.versions) }}
    name: test ${{ matrix.schema_version }}
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Dependencies
        run: npm install
      - name: Run test
        env:
          VALIDATE_BUNDLED: >-
            ${{ github.ref == 'refs/heads/master'
             || github.ref == 'refs/heads/main'
             || github.ref == 'refs/heads/2.0-dev'
             || (  github.event_name == 'pull_request'
                && github.base_ref == 'master'
                )
            }}
          SCHEMA_VERSION: ${{ matrix.schema_version }}
        run: npm run "test:v$SCHEMA_VERSION"
