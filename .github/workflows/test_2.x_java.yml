name: CT CDX-2.x Java

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

defaults:
  run:
    working-directory: tools

env:
  JAVA_VERSION: '8'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  discover-schema:
    uses: ./.github/workflows/discover_2.x_schema.yml
  test_java:
    needs:
      - discover-schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        schema_version: ${{ fromJSON(needs.discover-schema.outputs.versions) }}
    name: test ${{ matrix.schema_version }}
    steps:
    - name: Checkout
      # see https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK
      # see https://github.com/actions/setup-java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        java-package: jdk
    - name: test with Maven
      env:
        SCHEMA_VERSION: ${{ matrix.schema_version }}
      run: |
        mvn help:all-profiles | grep -q "Profile Id: schema-v${SCHEMA_VERSION}-tests" \
        || { echo "::error::No Maven profile 'schema-v${SCHEMA_VERSION}-tests' in tools/pom.xml"; \
             exit 1; }
        mvn clean test -P "schema-v${SCHEMA_VERSION}-tests"
    - name: Print report
      if: ${{ failure() }}
      run: cat ./target/surefire-reports/*
