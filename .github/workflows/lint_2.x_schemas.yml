name: Lint CycloneDX 2.x JSON Schemas

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  lint-schemas:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # see https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aspell aspell-en
      - name: Setup Node.js
        # see https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install linter
        working-directory: tools/src/main/js/linter
        run: npm install
      - name: Lint schemas
        run: |
          mapfile -d '' -t schemas < <(
            find schema \
              -type f \
              -path 'schema/2.*/*' \
              -name '*.schema.json' \
              -not -name '*-bundled*.schema.json' \
              -print0
          )
          node tools/src/main/js/linter/cli.js \
            --format json \
            "${schemas[@]}" \
            > tools/src/main/js/linter/CI_report.json
      - name: Print report
        if: '!cancelled()'
        run: cat tools/src/main/js/linter/CI_report.json
      - name: Artifact report
        if: '!cancelled()'
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report.json
          path: tools/src/main/js/linter/CI_report.json
          if-no-files-found: error
          retention-days: 7
