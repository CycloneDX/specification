name: Build CDX-1.x Docs

on:
  push:
    branches: ['master', 'main']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.10"

# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  docs_xml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docgen/schema-v1/xml
    steps:
    - name: Checkout
      # see https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK
      # see https://github.com/actions/setup-java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: '21'
        distribution: 'zulu'
        java-package: jdk
    - name: Generate Schema documentation
      run: ./gen.sh
    - name: Archive Schema documentation
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: XML-Schema-documentation
        path: docgen/schema-v1/xml/docs
        if-no-files-found: error
  docs_json:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docgen/schema-v1/json
    steps:
    - name: Checkout
      # see https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python Environment
      # see https://github.com/actions/setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
        architecture: 'x64'
    - name: Generate Schema documentation
      run: ./gen.sh
    - name: Archive Schema documentation
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: JSON-Schema-documentation
        path: docgen/schema-v1/json/docs
        if-no-files-found: error
  docs_proto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docgen/schema-v1/proto
    steps:
    - name: Checkout
      # see https://github.com/actions/checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Generate Schema documentation
      run: ./gen.sh
    - name: Archive Schema documentation
      # https://github.com/actions/upload-artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: PROTO-Schema-documentation
        path: docgen/schema-v1/proto/docs
        if-no-files-found: error
